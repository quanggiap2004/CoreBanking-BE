spring:
  application:
    name: core-banking-system
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:aws-1-ap-south-1.pooler.supabase.com}:${DB_PORT}/${DB_NAME} 
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari: 
      maximum-pool-size: 10
      minimum-idle: 5
  
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

app:
  jwt:
    secret: ${JWT_SECRET:change-this-in-production-minimum-256-bits-secret-key}
    expiration-ms: 86400000  # 24 hours
  
  interest:
    savings-rate: 0.0350  # 3.5% annual
    cron: "0 0 0 * * ?"   # Daily at midnight

logging:
  level:
    root: INFO
    com.banking.core: DEBUG
    org.hibernate.SQL: DEBUG
